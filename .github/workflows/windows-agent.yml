name: KEVIN Windows Agent Build
on:
  push:
    branches: ["apollo-foundation"]
    paths:
      - "apps/kevin-agent/**"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local agent
        run: cargo build --release --manifest-path apps/kevin-agent/Cargo.toml
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item apps/kevin-agent/target/release/kevin-local-agent.exe package/kevin-local-agent.exe
          Copy-Item .env.example package/.env.example
          Copy-Item README.md package/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: kevin-ai-office-windows-x64
          path: package/*
          if-no-files-found: error
          retention-days: 14
